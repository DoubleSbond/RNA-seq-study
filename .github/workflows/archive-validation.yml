name: Archive validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-archive:
    name: Validate public archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate archive
        run: python scripts/python/validate_archive.py

      - name: Check Python syntax
        run: python -m py_compile scripts/python/validate_archive.py
